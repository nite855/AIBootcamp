services:
  app:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - type: bind
        source: ./src
        target: /app/src
        read_only: true
      - type: bind
        source: ./static
        target: /app/static
        read_only: true
      - type: bind
        source: ${EMOTION_MODEL_PATH:-./models/emotion-kcelectra/checkpoint}
        target: /models/checkpoint
        read_only: true
    command:
      - uvicorn
      - emotion_service.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
      - --reload-dir
      - /app/src
