services:
  web:
    build:
      context: .
      dockerfile: infra/docker/frontend.Dockerfile
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    expose:
      - "5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-moment}
      POSTGRES_USER: ${POSTGRES_USER:-moment}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-moment_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-moment} -d ${POSTGRES_DB:-moment}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      EMOTION_MODEL_DIR: /models/checkpoint
      EMOTION_MOCK_MODE: ${EMOTION_MOCK_MODE:-0}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-moment}:${POSTGRES_PASSWORD:-moment_dev_password}@postgres:5432/${POSTGRES_DB:-moment}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-change-me-jwt-secret-key-at-least-32-bytes}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-14}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      CONSENT_HASH_SALT: ${CONSENT_HASH_SALT:-dev-consent-salt}
      AUTO_MIGRATE_DB: ${AUTO_MIGRATE_DB:-1}
    volumes:
      - type: bind
        source: ${EMOTION_MODEL_PATH:?EMOTION_MODEL_PATH must be set in .env}
        target: /models/checkpoint
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 120s
    restart: unless-stopped

volumes:
  postgres_data:
