server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Allow 10,000 Korean code points (~30-40KB UTF-8) + JSON metadata with headroom.
    client_max_body_size 256k;

    add_header X-Content-Type-Options "nosniff" always;

    # Preserve /api/ prefix to backend api service; never mask API errors with SPA HTML.
    # Use Docker embedded DNS + variable target so nginx survives API container restarts.
    location ^~ /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors off;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 60s;
    }

    # Revalidate card manifest so newly delivered card assets take effect immediately.
    location = /assets/cards/manifest.json {
        try_files $uri =404;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Return 404 for missing static assets instead of SPA fallback; long cache for hashed bundles.
    location ^~ /assets/ {
        try_files $uri =404;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location = /index.html {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }
}
