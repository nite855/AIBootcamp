<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>감정 분석 MVP</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <style>
    body { max-width: 960px; margin: 40px auto; padding: 0 16px; font-family: sans-serif; }
    textarea { width: 100%; min-height: 180px; box-sizing: border-box; }
    button { margin: 12px 0 24px; padding: 8px 16px; }
    #message { min-height: 24px; color: #b00020; }
    #results { display: grid; gap: 10px; margin-bottom: 24px; }
    .result { padding: 12px 16px; border: 1px solid #ddd; border-radius: 8px; }
    .result p { margin: 0 0 6px; }
    .result strong { color: #1d4ed8; }
    .input-meta { display: flex; justify-content: flex-end; margin-top: 4px; color: #555; }
    .analysis-grid { display: grid; grid-template-columns: minmax(0, 2fr) minmax(220px, 1fr); gap: 24px; }
    .chart-wrap { min-width: 0; }
    #word-frequencies { margin: 0; padding-left: 28px; max-height: 420px; overflow: auto; }
    #word-frequencies li { padding: 3px 0; }
    @media (max-width: 720px) { .analysis-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <h1>감정 분석</h1>
  <p>하나의 대화를 구성하는 문장을 한 줄에 하나씩 입력하세요(빈 줄 제외 최대 100줄).</p>
  <textarea id="text" placeholder="오늘은 정말 행복해.&#10;내일 면접이라 너무 불안해."></textarea>
  <div class="input-meta"><span id="line-count">0 / 100줄</span></div>
  <br>
  <button id="analyze" type="button">분석</button>
  <div id="message" role="alert"></div>
  <div id="results" aria-live="polite"></div>
  <div class="analysis-grid">
    <section class="chart-wrap">
      <h2>대화의 감정 변화</h2>
      <canvas id="chart"></canvas>
    </section>
    <section>
      <h2>단어 사용 빈도</h2>
      <ol id="word-frequencies" aria-live="polite"></ol>
    </section>
  </div>

  <script>
    const textInput = document.getElementById("text");
    const button = document.getElementById("analyze");
    const message = document.getElementById("message");
    const results = document.getElementById("results");
    const lineCount = document.getElementById("line-count");
    const wordFrequencies = document.getElementById("word-frequencies");
    const emotionColors = {
      "분노": "#dc2626",
      "슬픔": "#2563eb",
      "불안": "#7c3aed",
      "상처": "#db2777",
      "당황": "#ea580c",
      "기쁨": "#16a34a"
    };
    let chart;
    const lineLimitMessage = "문장은 빈 줄을 제외하고 100줄 이하로 입력하세요.";

    function getLines() {
      return textInput.value.split(/\r\n|\r|\n/).map(line => line.trim()).filter(Boolean);
    }

    function updateLineCount() {
      const count = getLines().length;
      lineCount.textContent = `${count} / 100줄`;
      lineCount.style.color = count > 100 ? "#b00020" : "#555";
      button.disabled = count === 0 || count > 100;
      if (count > 100) {
        message.textContent = lineLimitMessage;
      } else if (message.textContent === lineLimitMessage) {
        message.textContent = "";
      }
    }

    textInput.addEventListener("input", updateLineCount);
    updateLineCount();

    button.addEventListener("click", async () => {
      message.textContent = "";
      results.replaceChildren();
      wordFrequencies.replaceChildren();
      button.disabled = true;

      try {
        const response = await fetch("/api/analyze", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: textInput.value })
        });
        const result = await response.json();

        if (!response.ok) {
          throw new Error(result.detail || "분석 요청에 실패했습니다.");
        }

        result.predictions.forEach((prediction, index) => {
          const item = document.createElement("div");
          item.className = "result";

          const line = document.createElement("p");
          line.textContent = `${index + 1}. ${result.lines[index]}`;
          const summary = document.createElement("strong");
          summary.textContent = `${prediction.emotion} · ${(prediction.confidence * 100).toFixed(1)}%`;

          item.append(line, summary);
          results.append(item);
        });

        result.word_frequencies.forEach(({ word, count }) => {
          const item = document.createElement("li");
          item.textContent = `${word}: ${count}회`;
          wordFrequencies.append(item);
        });

        if (chart) chart.destroy();
        const emotions = result.predictions.length
          ? Object.keys(result.predictions[0].probabilities)
          : [];
        chart = new Chart(document.getElementById("chart"), {
          type: "line",
          data: {
            labels: result.lines.map((_, index) => `${index + 1}번 문장`),
            datasets: emotions.map(emotion => ({
              label: emotion,
              data: result.predictions.map(item => item.probabilities[emotion] || 0),
              borderColor: emotionColors[emotion] || "#475569",
              backgroundColor: emotionColors[emotion] || "#475569",
              pointRadius: 3,
              tension: 0.2
            }))
          },
          options: {
            responsive: true,
            interaction: { mode: "index", intersect: false },
            scales: {
              y: {
                min: 0,
                max: 1,
                title: { display: true, text: "감정 확률" },
                ticks: { callback: value => `${Math.round(value * 100)}%` }
              }
            },
            plugins: {
              tooltip: {
                callbacks: { label: context => `${context.dataset.label}: ${(context.raw * 100).toFixed(1)}%` }
              }
            }
          }
        });
      } catch (error) {
        if (chart) {
          chart.destroy();
          chart = undefined;
        }
        message.textContent = error.message;
      } finally {
        updateLineCount();
      }
    });
  </script>
</body>
</html>
